name: Java CI/CD with Gradle # 워크플로우명 (GitHub Actions UI에서 이 이름으로 워크플로우를 식별함)

#해당 워크플로우를 언제 실행할지 결정하는 조건
on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

#실행할 작업
jobs :
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name : Checkout repository with submodules
        uses : actions/checkout@v3
        with:
          #우리 서비스는 submodule이 1개이기 때문에 true , 중첩되어 있을 경우 recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}  # 서브모듈 접근용 토큰
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build WAR with Gradle
        run: ./gradlew clean build -x test

      - name: Verify build
        run: |
            ls -la build/libs/
            echo "WAR build completed successfully"
          
      - name: Build Docker image
        run: |
          docker build -f Dockerfile -t kbulkup-spring:latest --platform linux/amd64 .
          echo "Docker image built successfully"
          docker images | grep kbulkup-spring

      - name: Save Docker image to tar
        run: |
          docker save -o kbulkup-spring.tar kbulkup-spring:latest
          echo "Docker image saved to tar file"
          ls -lh kbulkup-spring.tar


      - name: Prepare deployment on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            cd /home/ec2-user && sudo docker-compose down || true 
            rm -f /home/ec2-user/kbulkup-spring.tar
            # 사용하지 않는 Docker 이미지 정리
            sudo docker image prune -f

      - name: Copy Docker image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
            host: ${{ secrets.EC2_HOST }}
            username: ec2-user
            key: ${{ secrets.EC2_KEY }}
            port: 22
            source: "kbulkup-spring.tar"
            target: "/home/ec2-user/"

      - name: Load image and start with docker-compose
        uses: appleboy/ssh-action@v1.0.3
        with:
            host: ${{ secrets.EC2_HOST }}
            username: ec2-user
            key: ${{ secrets.EC2_KEY }}
            port: 22
            script: |
              echo "Loading Docker image..."
              sudo docker load -i /home/ec2-user/kbulkup-spring.tar
              
              echo "Loaded images:"
              sudo docker images | grep kbulkup-spring
              
              echo "Starting services with docker-compose..."
              cd /home/ec2-user && sudo docker-compose up -d

              echo "Waiting for services to start..."
              sleep 30
              
              echo "=== Container Status ==="
              sudo docker ps
              
              timeout 90 bash -c 'until curl -f http://localhost:8080/ 2>/dev/null; do 
                echo "Waiting for Spring application..."
                sleep 5
              done && echo "✅ Spring application is healthy!" || echo "❌ Spring application health check failed"'
              
              rm -f /home/ec2-user/kbulkup-spring.tar
              echo "Deployment completed successfully!"