plugins {
    id 'java'
    id 'war' // 웹 애플리케이션으로 빌드

}

group 'com.example'
version '1.0-SNAPSHOT'
sourceCompatibility = '17' // 또는 사용하려는 JDK 버전에 맞춤 (예: '11', '17')

repositories {
    mavenCentral()
}

dependencies {
    // Spring Core 및 웹 관련
    implementation 'org.springframework:spring-context:5.3.30'
    implementation 'org.springframework:spring-webmvc:5.3.30'
    implementation 'org.springframework:spring-jdbc:5.3.30'

    // JSON 처리
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.3'

    // JJWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // javax.annotation
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    // [추가] Bean Validation
    implementation 'javax.validation:validation-api:2.0.1.Final'
    implementation 'org.hibernate.validator:hibernate-validator:6.2.5.Final'
    implementation 'org.glassfish:jakarta.el:3.0.3'

    // 데이터베이스 관련
    implementation 'mysql:mysql-connector-java:8.0.33'
    implementation 'com.zaxxer:HikariCP:3.4.5'

    // MyBatis
    implementation 'org.mybatis:mybatis:3.5.16'
    implementation 'org.mybatis:mybatis-spring:2.0.7'

    // JSP/Servlet 관련
    providedCompile 'javax.servlet:javax.servlet-api:4.0.1'
    providedCompile 'javax.servlet.jsp:javax.servlet.jsp-api:2.3.3'
    implementation 'javax.servlet:jstl:1.2'

    // 로깅
    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'ch.qos.logback:logback-classic:1.2.11'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // Spring Security
    implementation 'org.springframework.security:spring-security-core:5.8.5'
    implementation 'org.springframework.security:spring-security-web:5.8.5'
    implementation 'org.springframework.security:spring-security-config:5.8.5'


    // Java 8 날짜/시간 타입 (LocalDate, LocalDateTime 등) JSON 처리를 위한 의존성
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // WebSocket + STOMP 추가
    implementation 'org.springframework:spring-websocket:5.3.30'
    implementation 'org.springframework:spring-messaging:5.3.30'

    // MongoDB Core
    implementation 'org.springframework.data:spring-data-mongodb:3.4.13'
    implementation 'org.mongodb:mongodb-driver-sync:4.10.2'

    // 테스트
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'

    //Webclient
    implementation 'org.springframework:spring-webflux:5.3.23'
    implementation 'io.projectreactor.netty:reactor-netty:1.0.24'
    implementation 'io.netty:netty-resolver-dns-native-macos:4.1.100.Final:osx-aarch_64' //MAC의 경우

    // Spring Redis 의존성 추가
    implementation 'org.springframework.data:spring-data-redis:2.6.0'
    implementation 'redis.clients:jedis:3.6.3'
}

// WAR 파일 이름 설정 (선택 사항)
war {
    archiveFileName = "${project.name}.war"
    webAppDirectory = file('src/main/webapp')
}

test {
    useJUnitPlatform()
}